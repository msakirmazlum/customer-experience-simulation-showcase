<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">Participant experience journey</title>
  <desc id="desc">Six stages from joining the simulation to receiving actionable feedback.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1aa981"/>
      <stop offset="1" stop-color="#278bc5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#16323a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1440" height="650" rx="28" fill="#f5faf8"/>
  <text x="72" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="750" fill="#11343a">Participant experience journey</text>
  <text x="72" y="119" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#55757a">A focused flow that protects immersion while keeping every stage understandable.</text>
  <rect x="132" y="255" width="1176" height="8" rx="4" fill="url(#line)" opacity=".35"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(150 0)">
      <circle cx="0" cy="259" r="42" fill="#fff" stroke="#1aa981" stroke-width="4" filter="url(#shadow)"/>
      <path d="M-12 259h24M0 247v24" stroke="#1aa981" stroke-width="4" stroke-linecap="round"/>
      <text y="338" font-size="21" font-weight="700" fill="#11343a">Join</text>
      <text y="367" font-size="16" fill="#617b80">Low-friction entry</text>
    </g>
    <g transform="translate(378 0)">
      <circle cx="0" cy="259" r="42" fill="#fff" stroke="#1ba68a" stroke-width="4" filter="url(#shadow)"/>
      <rect x="-14" y="244" width="28" height="30" rx="4" fill="none" stroke="#1ba68a" stroke-width="3"/>
      <path d="M-8 252h16M-8 260h12M-8 268h8" stroke="#1ba68a" stroke-width="2.5" stroke-linecap="round"/>
      <text y="338" font-size="21" font-weight="700" fill="#11343a">Brief</text>
      <text y="367" font-size="16" fill="#617b80">Context without overload</text>
    </g>
    <g transform="translate(606 0)">
      <circle cx="0" cy="259" r="42" fill="#fff" stroke="#1d9c99" stroke-width="4" filter="url(#shadow)"/>
      <path d="M-18 246h29a8 8 0 018 8v8a8 8 0 01-8 8H-2l-10 8 2-8h-8a8 8 0 01-8-8v-8a8 8 0 018-8z" fill="none" stroke="#1d9c99" stroke-width="3" stroke-linejoin="round"/>
      <text y="338" font-size="21" font-weight="700" fill="#11343a">Converse</text>
      <text y="367" font-size="16" fill="#617b80">Natural voice interaction</text>
    </g>
    <g transform="translate(834 0)">
      <circle cx="0" cy="259" r="42" fill="#fff" stroke="#218fa9" stroke-width="4" filter="url(#shadow)"/>
      <path d="M-16 260l10 10 22-24" fill="none" stroke="#218fa9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="338" font-size="21" font-weight="700" fill="#11343a">Act</text>
      <text y="367" font-size="16" fill="#617b80">Simple credible choices</text>
    </g>
    <g transform="translate(1062 0)">
      <circle cx="0" cy="259" r="42" fill="#fff" stroke="#2587b7" stroke-width="4" filter="url(#shadow)"/>
      <path d="M-17 272v-14M-6 272v-25M5 272v-19M16 272v-34" stroke="#2587b7" stroke-width="4" stroke-linecap="round"/>
      <text y="338" font-size="21" font-weight="700" fill="#11343a">Evaluate</text>
      <text y="367" font-size="16" fill="#617b80">Evidence-led assessment</text>
    </g>
    <g transform="translate(1290 0)">
      <circle cx="0" cy="259" r="42" fill="#fff" stroke="#2780c4" stroke-width="4" filter="url(#shadow)"/>
      <path d="M-15 262l9 9 21-25M-16 244h13" fill="none" stroke="#2780c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="338" font-size="21" font-weight="700" fill="#11343a">Learn</text>
      <text y="367" font-size="16" fill="#617b80">Actionable feedback</text>
    </g>
  </g>

  <g transform="translate(72 458)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text y="0" font-size="15" font-weight="750" letter-spacing="1.8" fill="#668085">DESIGN FOCUS</text>
    <g transform="translate(0 30)" font-size="16" font-weight="650" fill="#23474d">
      <rect width="224" height="52" rx="26" fill="#e2f4ed"/><text x="112" y="33" text-anchor="middle">Low cognitive load</text>
      <rect x="242" width="228" height="52" rx="26" fill="#e2f2f4"/><text x="356" y="33" text-anchor="middle">Participant agency</text>
      <rect x="488" width="230" height="52" rx="26" fill="#e6eff8"/><text x="603" y="33" text-anchor="middle">Emotional realism</text>
      <rect x="736" width="234" height="52" rx="26" fill="#eaf1f8"/><text x="853" y="33" text-anchor="middle">Explainable results</text>
      <rect x="988" width="244" height="52" rx="26" fill="#edf5f2"/><text x="1110" y="33" text-anchor="middle">Operational clarity</text>
    </g>
  </g>
</svg>
