<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc">
  <title id="title">System and quality map</title>
  <desc id="desc">Layered architecture linking participant experience, orchestration, AI capabilities and governance.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b3239"/>
      <stop offset="1" stop-color="#124d56"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#6b9297"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#17363c" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1440" height="790" rx="28" fill="#f6faf9"/>
  <rect width="1440" height="142" rx="28" fill="url(#header)"/>
  <path d="M0 114h1440v28H0z" fill="url(#header)"/>
  <text x="70" y="68" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="750" fill="#f5fffc">System design and quality map</text>
  <text x="70" y="106" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b8d9d8">A layered view of the capabilities required for a reliable conversational AI product.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="70" y="194" font-size="14" font-weight="750" letter-spacing="1.7" fill="#6a8589">EXPERIENCE SURFACES</text>
    <g transform="translate(70 218)" filter="url(#shadow)">
      <rect width="380" height="112" rx="18" fill="#fff" stroke="#cbdedb"/>
      <circle cx="48" cy="56" r="25" fill="#dff4ed"/>
      <path d="M36 58c8-12 16-12 24 0M41 65c5 5 9 5 14 0" fill="none" stroke="#168d70" stroke-width="3" stroke-linecap="round"/>
      <text x="88" y="49" font-size="21" font-weight="700" fill="#17383e">Participant experience</text>
      <text x="88" y="76" font-size="16" fill="#637d82">Briefing • conversation • actions • feedback</text>
    </g>
    <g transform="translate(990 218)" filter="url(#shadow)">
      <rect width="380" height="112" rx="18" fill="#fff" stroke="#cbdedb"/>
      <circle cx="48" cy="56" r="25" fill="#e3eff7"/>
      <path d="M35 67h26M39 58h18M43 49h10M47 40h2" stroke="#277ea8" stroke-width="3" stroke-linecap="round"/>
      <text x="88" y="49" font-size="21" font-weight="700" fill="#17383e">Event operations</text>
      <text x="88" y="76" font-size="16" fill="#637d82">Session control • visibility • recovery</text>
    </g>

    <path d="M450 274h130" stroke="#6b9297" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M990 274H860" stroke="#6b9297" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(580 202)" filter="url(#shadow)">
      <rect width="280" height="144" rx="22" fill="#0e4c52"/>
      <text x="140" y="50" text-anchor="middle" font-size="22" font-weight="750" fill="#fff">Session orchestration</text>
      <text x="140" y="82" text-anchor="middle" font-size="16" fill="#bfe8e4">State • timing • isolation</text>
      <text x="140" y="107" text-anchor="middle" font-size="16" fill="#bfe8e4">completion • fallbacks</text>
    </g>

    <text x="70" y="408" font-size="14" font-weight="750" letter-spacing="1.7" fill="#6a8589">INTELLIGENCE AND DOMAIN LAYER</text>
    <g transform="translate(70 434)" filter="url(#shadow)">
      <rect width="300" height="126" rx="18" fill="#fff" stroke="#cbdedb"/>
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#e1f4ee"/>
      <text x="46" y="54" text-anchor="middle" font-size="24" font-weight="750" fill="#158769">S</text>
      <text x="86" y="48" font-size="20" font-weight="700" fill="#17383e">Scenario engine</text>
      <text x="24" y="92" font-size="15" fill="#637d82">Context • facts • boundaries</text>
    </g>
    <g transform="translate(405 434)" filter="url(#shadow)">
      <rect width="300" height="126" rx="18" fill="#fff" stroke="#cbdedb"/>
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#e1f1f3"/>
      <text x="46" y="54" text-anchor="middle" font-size="24" font-weight="750" fill="#248c96">C</text>
      <text x="86" y="48" font-size="20" font-weight="700" fill="#17383e">Conversation</text>
      <text x="24" y="92" font-size="15" fill="#637d82">Voice • persona • turn-taking</text>
    </g>
    <g transform="translate(740 434)" filter="url(#shadow)">
      <rect width="300" height="126" rx="18" fill="#fff" stroke="#cbdedb"/>
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#e4eef7"/>
      <text x="46" y="54" text-anchor="middle" font-size="24" font-weight="750" fill="#287eaa">E</text>
      <text x="86" y="48" font-size="20" font-weight="700" fill="#17383e">Evaluation</text>
      <text x="24" y="92" font-size="15" fill="#637d82">Evidence • structure • feedback</text>
    </g>
    <g transform="translate(1075 434)" filter="url(#shadow)">
      <rect width="295" height="126" rx="18" fill="#fff" stroke="#cbdedb"/>
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#fff1d8"/>
      <text x="46" y="54" text-anchor="middle" font-size="24" font-weight="750" fill="#b47714">R</text>
      <text x="86" y="48" font-size="20" font-weight="700" fill="#17383e">Results</text>
      <text x="24" y="92" font-size="15" fill="#637d82">Learning • ranking • insights</text>
    </g>
    <path d="M370 497h35M705 497h35M1040 497h35" stroke="#6b9297" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="70" y="632" font-size="14" font-weight="750" letter-spacing="1.7" fill="#6a8589">CROSS-CUTTING QUALITY CONTROLS</text>
    <g transform="translate(70 654)">
      <rect width="1300" height="76" rx="18" fill="#e9f3f0" stroke="#c6ddd8"/>
      <g font-size="16" font-weight="650" fill="#23474d" text-anchor="middle">
        <text x="130" y="46">Content contracts</text>
        <text x="370" y="46">Behavior validation</text>
        <text x="620" y="46">Failure recovery</text>
        <text x="850" y="46">Privacy boundaries</text>
        <text x="1090" y="46">Release verification</text>
      </g>
      <circle cx="244" cy="38" r="3" fill="#76aaa3"/><circle cx="496" cy="38" r="3" fill="#76aaa3"/><circle cx="733" cy="38" r="3" fill="#76aaa3"/><circle cx="970" cy="38" r="3" fill="#76aaa3"/>
    </g>
