<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end product capability stack</title>
  <desc id="desc">Five connected capability areas spanning product strategy, domain design, conversational AI, engineering and operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c27"/><stop offset="1" stop-color="#0b4545"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee6b8"/><stop offset="1" stop-color="#74d7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#001014" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1250" cy="90" r="260" fill="#62e6bd" opacity=".06"/>
  <circle cx="140" cy="760" r="330" fill="#4da9ff" opacity=".05"/>
  <text x="70" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="760" fill="#f4fffb">End-to-end product capability</text>
  <text x="70" y="116" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#b9d7d7">Connecting customer experience, AI behavior, software delivery and live operations.</text>
  <rect x="70" y="150" width="1300" height="4" rx="2" fill="url(#accent)" opacity=".8"/>

  <g transform="translate(70 196)" font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g>
      <rect width="244" height="420" rx="22" fill="#0e3038" stroke="#3e6970"/>
      <circle cx="38" cy="42" r="19" fill="#184a45"/><text x="38" y="49" text-anchor="middle" font-size="18" font-weight="750" fill="#66e5b8">01</text>
      <text x="24" y="92" font-size="23" font-weight="750" fill="#fff">Product strategy</text>
      <text x="24" y="128" font-size="15" fill="#8eb4b7">FRAME THE EXPERIENCE</text>
      <g font-size="16" fill="#c4dcdd">
        <text x="24" y="174">• Outcome definition</text><text x="24" y="210">• Journey architecture</text>
        <text x="24" y="246">• Scope and trade-offs</text><text x="24" y="282">• Stakeholder feedback</text>
      </g>
      <rect x="20" y="330" width="204" height="66" rx="14" fill="#123f43"/>
      <text x="122" y="358" text-anchor="middle" font-size="14" fill="#8fc2c0">DELIVERABLE</text>
      <text x="122" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#eafff8">Testable product flow</text>
    </g>
    <g transform="translate(264)">
      <rect width="244" height="420" rx="22" fill="#0e3038" stroke="#3e6970"/>
      <circle cx="38" cy="42" r="19" fill="#184a45"/><text x="38" y="49" text-anchor="middle" font-size="18" font-weight="750" fill="#66e5b8">02</text>
      <text x="24" y="92" font-size="23" font-weight="750" fill="#fff">Domain design</text>
      <text x="24" y="128" font-size="15" fill="#8eb4b7">MODEL REAL SITUATIONS</text>
      <g font-size="16" fill="#c4dcdd">
        <text x="24" y="174">• Scenario contracts</text><text x="24" y="210">• Persona behavior</text>
        <text x="24" y="246">• Action boundaries</text><text x="24" y="282">• Content governance</text>
      </g>
      <rect x="20" y="330" width="204" height="66" rx="14" fill="#123f43"/>
      <text x="122" y="358" text-anchor="middle" font-size="14" fill="#8fc2c0">DELIVERABLE</text>
      <text x="122" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#eafff8">Credible interactions</text>
    </g>
    <g transform="translate(528)">
      <rect width="244" height="420" rx="22" fill="#0e3038" stroke="#3e6970"/>
      <circle cx="38" cy="42" r="19" fill="#17434b"/><text x="38" y="49" text-anchor="middle" font-size="18" font-weight="750" fill="#71d9ef">03</text>
      <text x="24" y="92" font-size="23" font-weight="750" fill="#fff">Conversational AI</text>
      <text x="24" y="128" font-size="15" fill="#8eb4b7">CONTROL AI BEHAVIOR</text>
      <g font-size="16" fill="#c4dcdd">
        <text x="24" y="174">• Turn-taking</text><text x="24" y="210">• Emotional response</text>
        <text x="24" y="246">• Persona consistency</text><text x="24" y="282">• Evidence-led scoring</text>
      </g>
      <rect x="20" y="330" width="204" height="66" rx="14" fill="#123f43"/>
      <text x="122" y="358" text-anchor="middle" font-size="14" fill="#8fc2c0">DELIVERABLE</text>
      <text x="122" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#eafff8">Natural, bounded AI</text>
    </g>
    <g transform="translate(792)">
      <rect width="244" height="420" rx="22" fill="#0e3038" stroke="#3e6970"/>
      <circle cx="38" cy="42" r="19" fill="#173e50"/><text x="38" y="49" text-anchor="middle" font-size="18" font-weight="750" fill="#79cbff">04</text>
      <text x="24" y="92" font-size="23" font-weight="750" fill="#fff">Engineering</text>
      <text x="24" y="128" font-size="15" fill="#8eb4b7">BUILD THE SYSTEM</text>
      <g font-size="16" fill="#c4dcdd">
        <text x="24" y="174">• Session orchestration</text><text x="24" y="210">• Responsive interfaces</text>
        <text x="24" y="246">• State and persistence</text><text x="24" y="282">• Failure recovery</text>
      </g>
      <rect x="20" y="330" width="204" height="66" rx="14" fill="#123f43"/>
      <text x="122" y="358" text-anchor="middle" font-size="14" fill="#8fc2c0">DELIVERABLE</text>
      <text x="122" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#eafff8">Reliable application</text>
    </g>
    <g transform="translate(1056)">
      <rect width="244" height="420" rx="22" fill="#0e3038" stroke="#3e6970"/>
      <circle cx="38" cy="42" r="19" fill="#4a4025"/><text x="38" y="49" text-anchor="middle" font-size="18" font-weight="750" fill="#ffd579">05</text>
      <text x="24" y="92" font-size="23" font-weight="750" fill="#fff">Quality &amp; operations</text>
      <text x="24" y="128" font-size="15" fill="#8eb4b7">DELIVER WITH CONTROL</text>
      <g font-size="16" fill="#c4dcdd">
