        <text x="24" y="246">• Event operations</text><text x="24" y="282">• Privacy boundaries</text>
      </g>
      <rect x="20" y="330" width="204" height="66" rx="14" fill="#123f43"/>
      <text x="122" y="358" text-anchor="middle" font-size="14" fill="#8fc2c0">DELIVERABLE</text>
      <text x="122" y="382" text-anchor="middle" font-size="16" font-weight="700" fill="#eafff8">Event-ready release</text>
    </g>
  </g>
  <text x="720" y="682" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.8" fill="#9dc8c7">DISCOVER → DESIGN → BUILD → VALIDATE → OPERATE → LEARN</text>
</svg>
