<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Customer Experience Simulation</title>
  <desc id="desc">Portfolio cover presenting conversational AI, experience design and reliable delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a24"/>
      <stop offset="0.55" stop-color="#0b2f38"/>
      <stop offset="1" stop-color="#0c4b48"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee6b8"/>
      <stop offset="1" stop-color="#74d7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#001014" flood-opacity=".45"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#a9fff0" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1440" height="720" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="720" rx="28" fill="url(#grid)"/>
  <circle cx="1260" cy="80" r="270" fill="#50e3c2" opacity=".07"/>
  <circle cx="1160" cy="660" r="360" fill="#4eb8ff" opacity=".055"/>

  <g transform="translate(92 76)">
    <rect width="244" height="42" rx="21" fill="#123d43" stroke="#5ee6b8" stroke-opacity=".55"/>
    <circle cx="24" cy="21" r="6" fill="#5ee6b8"/>
    <text x="42" y="27" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#baf9e5">PORTFOLIO CASE STUDY</text>

    <text x="0" y="142" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="760" fill="#f5fffc">AI Customer</text>
    <text x="0" y="218" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="760" fill="url(#accent)">Experience Simulation</text>
    <text x="2" y="269" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#b8d5d7">From open conversation to structured, explainable feedback.</text>

    <g transform="translate(0 334)" filter="url(#shadow)">
      <g>
        <rect width="360" height="160" rx="20" fill="#0d2b34" stroke="#37636a"/>
        <circle cx="46" cy="44" r="22" fill="#153f42"/>
        <path d="M35 43c9-13 21-13 30 0M40 51c6 7 14 7 20 0" fill="none" stroke="#5ee6b8" stroke-width="3" stroke-linecap="round"/>
        <text x="82" y="50" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#f4fffb">Human-centered</text>
        <text x="28" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#b8d5d7">Realistic emotion, low cognitive load</text>
        <text x="28" y="120" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#b8d5d7">and participant agency by design.</text>
      </g>
      <g transform="translate(386)">
        <rect width="360" height="160" rx="20" fill="#0d2b34" stroke="#37636a"/>
        <circle cx="46" cy="44" r="22" fill="#153f42"/>
        <path d="M34 50l9-9 7 7 13-16" fill="none" stroke="#74d7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="82" y="50" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#f4fffb">Quality-aware</text>
        <text x="28" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#b8d5d7">Observable behaviors become</text>
        <text x="28" y="120" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#b8d5d7">structured, actionable feedback.</text>
      </g>
      <g transform="translate(772)">
        <rect width="360" height="160" rx="20" fill="#0d2b34" stroke="#37636a"/>
        <circle cx="46" cy="44" r="22" fill="#153f42"/>
        <path d="M35 47h22M39 39h14M43 31h6" fill="none" stroke="#ffd579" stroke-width="3" stroke-linecap="round"/>
        <text x="82" y="50" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#f4fffb">Event-ready</text>
        <text x="28" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#b8d5d7">Resilient sessions, operational</text>
        <text x="28" y="120" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#b8d5d7">controls and release validation.</text>
      </g>
    </g>

    <text x="0" y="582" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" letter-spacing="2.2" fill="#80aaa9">PRODUCT • CONVERSATIONAL AI • REAL-TIME SYSTEMS • EVALUATION</text>
  </g>
</svg>
